<svg width="500" height="70" viewBox="0 0 500 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2;#FF69B4;#00BFFF;#8A2BE2" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00BFFF">
        <animate attributeName="stop-color" values="#00BFFF;#8A2BE2;#FF69B4;#00BFFF" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="bglow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#bglow)">
    <rect x="10" y="15" width="180" height="40" rx="20" fill="#0d1117" stroke="url(#bgrad)" stroke-width="2"/>
    <text x="30" y="40" font-family="Trebuchet MS, sans-serif" font-size="14" fill="#ffffff">👁️ Profile Views</text>
    <circle cx="172" cy="35" r="3" fill="#00e0a0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#bglow)">
    <rect x="210" y="15" width="160" height="40" rx="20" fill="#0d1117" stroke="url(#bgrad)" stroke-width="2"/>
    <text x="230" y="40" font-family="Trebuchet MS, sans-serif" font-size="14" fill="#ffffff">⭐ Followers</text>
    <circle cx="352" cy="35" r="3" fill="#FF69B4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#bglow)">
    <rect x="390" y="15" width="100" height="40" rx="20" fill="#0d1117" stroke="url(#bgrad)" stroke-width="2"/>
    <text x="410" y="40" font-family="Trebuchet MS, sans-serif" font-size="14" fill="#ffffff">🔥 Active</text>
  </g>
</svg>
